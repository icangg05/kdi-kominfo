# Pengembangan: kode di-bind mount dan Astro berjalan dengan HMR.
# Mewarisi compose.yml lewat extends, jadi bisa dipakai sendiri:
#   docker compose -f compose.dev.yml up -d
services:
  caddy:
    extends: { file: compose.yml, service: caddy }

  db:
    extends: { file: compose.yml, service: db }

  app:
    extends: { file: compose.yml, service: app }
    volumes:
      - ./:/app
      - app-storage:/app/storage/app

  web:
    extends: { file: compose.yml, service: web }
    build:
      target: deps
    # --ignore-lock: PID di .astro/dev.json (bind mount) selalu bentrok dengan PID container baru.
    command: npm run dev -- --host 0.0.0.0 --ignore-lock
    environment:
      NODE_ENV: development
    volumes:
      - ./web:/srv
      - web-node-modules:/srv/node_modules

volumes:
  db-data:
  caddy-data:
  caddy-config:
  app-storage:
  web-node-modules:
